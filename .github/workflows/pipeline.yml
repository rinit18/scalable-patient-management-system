name: Production CI/CD Pipeline

on:
  push:
    branches: ["main"]

jobs:
  # 1. First, verify the Java code compiles across all services in parallel
  maven-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [auth-service, patient-service, billing-service, analytics-service, api-gateway]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: Compile ${{ matrix.service }}
        run: mvn -B clean package -DskipTests -f ${{ matrix.service }}/pom.xml

  # 2. If it compiles, spin up containers and run Integration Tests
  integration-test:
    needs: maven-build  # <--- Waits for maven-build matrix to finish successfully
    runs-on: ubuntu-latest
    env:
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Build containers and Start Services
        run: docker compose up -d --build
      - name: Wait for Services to Start
        run: |
          echo "Waiting for backend services to initialize..."
          for i in {1..30}; do
            # Request /auth/validate without a token. It should return 401 if auth-service is ready.
            # If it returns 500, 502, or 503, the gateway is up but auth-service is not ready yet.
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:4004/auth/validate || echo "000")
            if [ "$STATUS" = "401" ]; then
              echo "Auth service is responding!"
              # Wait an additional 20 seconds for Patient/Billing services and Kafka to fully initialize
              sleep 20
              break
            fi
            echo "Still waiting... (HTTP $STATUS)"
            sleep 5
          done
      - name: Run Tests
        run: mvn test -f integration-tests/pom.xml
      - name: Teardown
        run: docker compose down

  # 3. If tests pass, build and push production Docker images to AWS ECR
  push-to-ecr:
    needs: integration-test # <--- Waits for integration-test to pass completely
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api-gateway, auth-service, patient-service, billing-service, analytics-service]
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push ${{ matrix.service }}
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t $ECR_REGISTRY/${{ matrix.service }}:latest ./${{ matrix.service }}
          docker push $ECR_REGISTRY/${{ matrix.service }}:latest

  # 4. Finally, notify your AWS EC2 server to download fresh images from ECR
  deploy-to-ec2:
    needs: push-to-ecr # <--- Properly aligned at the root level of jobs
    runs-on: ubuntu-latest
    steps:
      - name: Executing Remote SSH Commands
        uses: appleboy/ssh-action@v1.0.3
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: AWS_ACCOUNT_ID,AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,POSTGRES_USER,POSTGRES_PASSWORD,JWT_SECRET
          script: |
            # 1. Navigate to your project folder
            cd ~/scalable-patient-management-system

            # 2. Create .env file for docker-compose to read
            echo "AWS_ACCOUNT_ID=${AWS_ACCOUNT_ID}" > .env
            echo "POSTGRES_USER=${POSTGRES_USER}" >> .env
            echo "POSTGRES_PASSWORD=${POSTGRES_PASSWORD}" >> .env
            echo "JWT_SECRET=${JWT_SECRET}" >> .env

            # 3. Install AWS CLI v2 if missing
            if ! command -v aws &> /dev/null; then
              echo "Installing AWS CLI v2..."
              curl -s "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
              sudo apt-get update && sudo apt-get install unzip -y
              unzip -q awscliv2.zip
              sudo ./aws/install
              rm -rf aws awscliv2.zip
            fi

            # 4. Log the EC2 server into your private AWS ECR Registry
            export AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
            export AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
            export AWS_DEFAULT_REGION=us-east-1
            aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin ${AWS_ACCOUNT_ID}.dkr.ecr.us-east-1.amazonaws.com

            # 5. Pull the latest docker-compose.yml file
            git pull origin main

            # 6. Pull pre-built images from ECR (lightning fast, no CPU compiling!)
            docker compose pull

            # 7. Hot-restart the infrastructure
            docker compose down
            docker compose up -d --remove-orphans