name: Production CI/CD Pipeline

on:
  push:
    branches: ["main"]

jobs:
  # 1. First, verify the Java code compiles across all services in parallel
  maven-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [auth-service, patient-service, billing-service, analytics-service, api-gateway]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: Compile ${{ matrix.service }}
        run: mvn -B clean package -DskipTests -f ${{ matrix.service }}/pom.xml

  # 2. If it compiles, spin up containers and run Integration Tests
  integration-test:
    needs: maven-build  # <--- Waits for maven-build matrix to finish successfully
    runs-on: ubuntu-latest
    env:
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Build containers and Start Services
        run: docker compose up -d --build
      - name: Wait for API Gateway
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:4004 > /dev/null; then echo "Up!"; break; fi
            sleep 5
          done
      - name: Run Tests
        run: mvn test -f integration-tests/pom.xml
      - name: Teardown
        run: docker compose down

  # 3. If tests pass, build and push production Docker images to AWS ECR
  push-to-ecr:
    needs: integration-test # <--- Waits for integration-test to pass completely
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api-gateway, auth-service, patient-service, billing-service, analytics-service]
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push ${{ matrix.service }}
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t $ECR_REGISTRY/${{ matrix.service }}:latest ./${{ matrix.service }}
          docker push $ECR_REGISTRY/${{ matrix.service }}:latest

  # 4. Finally, notify your AWS EC2 server to download fresh images from ECR
  deploy-to-ec2:
    needs: push-to-ecr # <--- Properly aligned at the root level of jobs
    runs-on: ubuntu-latest
    steps:
      - name: Executing Remote SSH Commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 1. Log the EC2 server into your private AWS ECR Registry
            aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com

            # 2. Navigate to your project folder
            cd ~/scalable-patient-management-system

            # 3. Pull the latest docker-compose.yml file
            git pull origin main

            # 4. Pull pre-built images from ECR (lightning fast, no CPU compiling!)
            docker compose pull

            # 5. Hot-restart the infrastructure
            docker compose down
            docker compose up -d --remove-orphans