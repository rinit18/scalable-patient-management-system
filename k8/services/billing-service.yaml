apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-service
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: billing-service
  template:
    metadata:
      labels:
        app: billing-service
    spec:
      containers:
      - name: billing-service
        image: billing-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 4001
        - containerPort: 9001
        env:
        - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
          valueFrom:
            configMapKeyRef:
              name: patient-management-config
              key: KAFKA_BOOTSTRAP_SERVERS
---
apiVersion: v1
kind: Service
metadata:
  name: billing-service
  namespace: default
spec:
  selector:
    app: billing-service
  ports:
    - name: http
      protocol: TCP
      port: 4001
      targetPort: 4001
    - name: grpc
      protocol: TCP
      port: 9001
      targetPort: 9001
