apiVersion: v1
kind: ConfigMap
metadata:
  name: patient-management-config
  namespace: default
data:
  POSTGRES_USER: "postgres"
  # Kafka Brokers
  KAFKA_BOOTSTRAP_SERVERS: "kafka-service:9092"
  # Redis
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
  # Database URLs
  AUTH_DB_URL: "jdbc:postgresql://auth-db-service:5432/db"
  PATIENT_DB_URL: "jdbc:postgresql://patient-db-service:5432/db"
  # Service Endpoints
  BILLING_SERVICE_ADDRESS: "billing-service"
  BILLING_SERVICE_GRPC_PORT: "9001"
  AUTH_SERVICE_URL: "http://auth-service:4005"
